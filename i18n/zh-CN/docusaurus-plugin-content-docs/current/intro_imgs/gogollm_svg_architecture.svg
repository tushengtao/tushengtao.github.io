<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="layerGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5f72e4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6d48a3;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="layerGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="layerGradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="layerGradient4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="layerGradient5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 箭头标记 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#667eea" />
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1600" height="900" fill="#f8f9fa"/>
  
  <!-- 标题区域 -->
  <rect width="1600" height="100" fill="url(#headerGradient)"/>
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">
    GoGoLLM 企业级大模型应用平台架构
  </text>
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.95">
    高可用 | 高并发 | 全链路可观测 | 企业级生产验证
  </text>
  
  <!-- 左侧：用户/客户端 -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="200" height="600" rx="15" fill="white" stroke="#dee2e6" stroke-width="2"/>
    <rect x="50" y="150" width="200" height="50" rx="15" fill="url(#headerGradient)"/>
    <text x="150" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      用户/应用
    </text>
    
    <!-- 客户端类型 -->
    <rect x="70" y="220" width="160" height="60" rx="8" fill="#e7f3ff" stroke="#667eea" stroke-width="2"/>
    <text x="150" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      Web应用
    </text>
    <text x="150" y="265" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">
      浏览器端
    </text>
    
    <rect x="70" y="300" width="160" height="60" rx="8" fill="#e7f3ff" stroke="#667eea" stroke-width="2"/>
    <text x="150" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      移动应用
    </text>
    <text x="150" y="345" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">
      iOS/Android
    </text>
    
    <rect x="70" y="380" width="160" height="60" rx="8" fill="#e7f3ff" stroke="#667eea" stroke-width="2"/>
    <text x="150" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      桌面应用
    </text>
    <text x="150" y="425" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">
      Desktop Client
    </text>
    
    <rect x="70" y="460" width="160" height="60" rx="8" fill="#e7f3ff" stroke="#667eea" stroke-width="2"/>
    <text x="150" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      API调用
    </text>
    <text x="150" y="505" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">
      第三方集成
    </text>
    
    <rect x="70" y="540" width="160" height="60" rx="8" fill="#e7f3ff" stroke="#667eea" stroke-width="2"/>
    <text x="150" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      命令行工具
    </text>
    <text x="150" y="585" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">
      Claude Code
    </text>
  </g>
  
  <!-- 箭头：用户到网关 -->
  <line x1="250" y1="400" x2="320" y2="400" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 中间：核心架构层 -->
  <g filter="url(#shadow)">
    <!-- 1. API网关层 -->
    <rect x="320" y="150" width="540" height="120" rx="15" fill="url(#layerGradient1)" stroke="#667eea" stroke-width="3"/>
    <text x="590" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      🌐 API网关层 - Higress AI Gateway
    </text>
    
    <rect x="340" y="200" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="417" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">负载均衡</text>
    <text x="417" y="238" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">多节点分发</text>
    
    <rect x="510" y="200" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="587" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">智能路由</text>
    <text x="587" y="238" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">动态选择模型</text>
    
    <rect x="680" y="200" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="757" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">服务降级</text>
    <text x="757" y="238" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">故障容错</text>
    
    <!-- 箭头 -->
    <line x1="590" y1="270" x2="590" y2="295" stroke="white" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- 2. 应用编排层 -->
    <rect x="320" y="295" width="540" height="120" rx="15" fill="url(#layerGradient2)" stroke="#44a08d" stroke-width="3"/>
    <text x="590" y="330" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      🎯 应用编排层 - LangGraph工作流引擎
    </text>
    
    <rect x="340" y="345" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="400" y="367" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">可视化编排</text>
    <text x="400" y="383" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">拖拽配置</text>
    
    <rect x="475" y="345" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="535" y="367" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">智能体编排</text>
    <text x="535" y="383" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">单/多智能体</text>
    
    <rect x="610" y="345" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="670" y="367" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">流程控制</text>
    <text x="670" y="383" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">并行/分支/循环</text>
    
    <rect x="745" y="345" width="100" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="795" y="367" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">人机协作</text>
    <text x="795" y="383" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Human-Loop</text>
    
    <!-- 箭头 -->
    <line x1="590" y1="415" x2="590" y2="440" stroke="white" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- 3. 工具集成层 -->
    <rect x="320" y="440" width="540" height="120" rx="15" fill="url(#layerGradient3)" stroke="#f5576c" stroke-width="3"/>
    <text x="590" y="475" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      🔧 工具集成层 - 三类工具生态
    </text>
    
    <rect x="340" y="490" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="417" y="512" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">本地代码工具</text>
    <text x="417" y="528" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">自研工具集成</text>
    
    <rect x="510" y="490" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="587" y="512" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">MCP远程工具</text>
    <text x="587" y="528" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">SSE协议支持</text>
    
    <rect x="680" y="490" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="757" y="512" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">工作流工具</text>
    <text x="757" y="528" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">编排作为工具</text>
    
    <!-- 箭头 -->
    <line x1="590" y1="560" x2="590" y2="585" stroke="white" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- 4. 数据存储层 -->
    <rect x="320" y="585" width="540" height="120" rx="15" fill="url(#layerGradient4)" stroke="#fee140" stroke-width="3"/>
    <text x="590" y="620" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      💾 数据存储层 - 多维数据管理
    </text>
    
    <rect x="340" y="635" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="400" y="657" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">PostgreSQL</text>
    <text x="400" y="673" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">业务数据</text>
    
    <rect x="475" y="635" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="535" y="657" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">ElasticSearch</text>
    <text x="535" y="673" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">语义搜索</text>
    
    <rect x="610" y="635" width="120" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="670" y="657" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">ClickHouse</text>
    <text x="670" y="673" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">可观测数据</text>
    
    <rect x="745" y="635" width="100" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="795" y="657" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">知识库</text>
    <text x="795" y="673" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">向量检索</text>
  </g>
  
  <!-- 右侧上：大模型服务商 -->
  <g filter="url(#shadow)">
    <rect x="920" y="150" width="270" height="280" rx="15" fill="white" stroke="#dee2e6" stroke-width="2"/>
    <rect x="920" y="150" width="270" height="50" rx="15" fill="url(#headerGradient)"/>
    <text x="1055" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      大模型服务商
    </text>
    
    <rect x="940" y="220" width="230" height="45" rx="8" fill="#fff4e6" stroke="#ffa500" stroke-width="2"/>
    <text x="1055" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      阿里云通义大模型
    </text>
    
    <rect x="940" y="280" width="230" height="45" rx="8" fill="#e7f3ff" stroke="#0066cc" stroke-width="2"/>
    <text x="1055" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      OpenAI GPT系列
    </text>
    
    <rect x="940" y="340" width="230" height="45" rx="8" fill="#f0f0ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1055" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">
      DeepSeek
    </text>
    
    <rect x="940" y="400" width="110" height="40" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="995" y="425" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle">
      豆包大模型
    </text>
    
    <rect x="1060" y="400" width="110" height="40" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
    <text x="1115" y="425" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle">
      智谱AI
    </text>
  </g>
  
  <!-- 右侧下：扩展工具 -->
  <g filter="url(#shadow)">
    <rect x="920" y="460" width="270" height="245" rx="15" fill="white" stroke="#dee2e6" stroke-width="2"/>
    <rect x="920" y="460" width="270" height="50" rx="15" fill="url(#layerGradient2)"/>
    <text x="1055" y="492" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      扩展工具生态
    </text>
    
    <rect x="940" y="530" width="230" height="40" rx="8" fill="#fff9e6" stroke="#ffc107" stroke-width="2"/>
    <text x="1055" y="555" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">
      GoGoLLM-Sandbox 代码沙盒
    </text>
    
    <rect x="940" y="585" width="230" height="40" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="1055" y="610" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">
      GoGoLLM-Reader 网页读取
    </text>
    
    <rect x="940" y="640" width="230" height="40" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="1055" y="665" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">
      MCP工具协议支持
    </text>
  </g>
  
  <!-- 底部：安全与监控 -->
  <g filter="url(#shadow)">
    <rect x="320" y="730" width="870" height="120" rx="15" fill="url(#layerGradient5)" stroke="#330867" stroke-width="3"/>
    <text x="755" y="765" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
      🛡️ 安全与可观测层
    </text>
    
    <rect x="340" y="780" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="417" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">雷池WAF防火墙</text>
    <text x="417" y="818" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">Web应用防护</text>
    
    <rect x="510" y="780" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="587" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">Trace追踪</text>
    <text x="587" y="818" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">全链路追踪</text>
    
    <rect x="680" y="780" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="757" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">成本分析</text>
    <text x="757" y="818" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">实时统计</text>
    
    <rect x="850" y="780" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="927" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">提示词管理</text>
    <text x="927" y="818" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">版本控制</text>
    
    <rect x="1020" y="780" width="155" height="50" rx="8" fill="rgba(255,255,255,0.95)"/>
    <text x="1097" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057" text-anchor="middle">应用评估</text>
    <text x="1097" y="818" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">质量监控</text>
  </g>
  
  <!-- 箭头：网关到大模型 -->
  <line x1="860" y1="210" x2="920" y2="300" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="210" x2="920" y2="320" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="210" x2="920" y2="360" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 箭头：工具层到扩展工具 -->
  <line x1="860" y1="500" x2="920" y2="550" stroke="#f5576c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="500" x2="920" y2="605" stroke="#f5576c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="860" y1="500" x2="920" y2="660" stroke="#f5576c" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 箭头：数据层到安全层 -->
  <line x1="590" y1="705" x2="590" y2="730" stroke="#fee140" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 底部说明 -->
  <text x="1300" y="885" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">
    GoGoLLM © 2025 | 企业级生产验证 | 微信：tushengtao1014
  </text>
  
  <!-- 版本标记 -->
  <rect x="1450" y="20" width="120" height="30" rx="15" fill="#4caf50"/>
  <text x="1510" y="42" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    2025最新版
  </text>
</svg>